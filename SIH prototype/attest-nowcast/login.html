<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | AttestNow</title><link rel="stylesheet" href="style.css"></head><body>
<div class="auth"><div class="box"><a class="logo" href="index.html">⛈ Attest<span>Now</span></a>
<div class="tabs"><button id="t1" class="on">Login</button><button id="t2">Register</button></div>
<div id="nm" style="display:none"><label>Full name</label><input id="n" placeholder="Your name"><label>Role</label><select id="r"><option>Disaster Authority</option><option>Emergency Responder</option><option>Analyst</option></select></div>
<label>Email</label><input id="e" type="email" placeholder="you@example.com"><label>Password</label><input id="p" type="password" placeholder="••••••••">
<div class="msg" id="m"></div><button class="btn" style="width:100%" id="go">Login</button>
<p class="hint">Demo: admin@attest.in / demo123</p></div></div>
<script src="app.js"></script><script>
let reg=false;const $=i=>document.getElementById(i);
function tab(r){reg=r;$('t1').className=r?'':'on';$('t2').className=r?'on':'';$('nm').style.display=r?'block':'none';$('go').textContent=r?'Create account':'Login';$('m').textContent=''}
$('t1').onclick=()=>tab(false);$('t2').onclick=()=>tab(true);
$('go').onclick=()=>{const e=$('e').value.trim(),p=$('p').value;if(!e||p.length<4){$('m').textContent='Enter a valid email and password (4+ chars).';return}
let ok=reg?register({name:$('n').value||e,email:e,pass:p,role:$('r').value}):login(e,p);
if(ok)location.href='dashboard.html';else $('m').textContent=reg?'Account already exists.':'Invalid credentials.'};
if(me())location.href='dashboard.html';</script></body></html>
